<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Resource &amp; Schedule Optimizer</title>
<style>
  :root{
    --bg:#0A0E13; --panel:#12181F; --panel-alt:#161D26; --panel-hi:#1B232D;
    --border:#232B35; --border-soft:#1B222B;
    --text:#DDE3E8; --text-dim:#8A96A3; --text-faint:#5B6672;
    --teal:#2FB8AC; --teal-dim:rgba(47,184,172,.15);
    --blue:#4C8DFF; --blue-dim:rgba(76,141,255,.15);
    --green:#34D399; --green-dim:rgba(52,211,153,.15);
    --amber:#E8A93A; --amber-dim:rgba(232,169,58,.15);
    --red:#E8574A; --red-dim:rgba(232,87,74,.15);
    --purple:#9B87F5; --purple-dim:rgba(155,135,245,.15);
    --mono:'SF Mono','Consolas','Monaco',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --disp:'Segoe UI Semibold',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; }
  ::-webkit-scrollbar{height:8px; width:8px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  .topbar{ display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,#0D1319,#0A0E13); position:sticky; top:0; z-index:30; flex-wrap:wrap; row-gap:8px;}
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px var(--teal); animation:pulse 2.4s infinite; flex:none;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .brand h1{ font-family:var(--disp); font-size:14px; font-weight:700; margin:0; letter-spacing:.02em; text-transform:uppercase; }
  .brand .tag{ font-family:var(--mono); font-size:9.5px; color:var(--text-dim); }
  .proj-name-input{ background:transparent; border:none; color:var(--text); font-family:var(--disp); font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; border-bottom:1px dashed var(--border); padding:2px 0; width:260px;}
  .proj-name-input:focus{ outline:none; border-color:var(--teal); }
  .nav{ display:flex; gap:2px; flex-wrap:wrap; }
  .nav button{ background:transparent; border:1px solid transparent; color:var(--text-dim); font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:7px 12px; border-radius:6px; cursor:pointer; }
  .nav button:hover{ color:var(--text); background:var(--panel-alt); }
  .nav button.active{ color:var(--bg); background:var(--teal); font-weight:700; }
  .topbar-right{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  select, .btn{ font-family:var(--mono); font-size:11px; }
  select{ background:var(--panel-alt); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:7px 9px; }

  .wrap{ max-width:1280px; margin:0 auto; padding:22px; }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
  .grid{ display:grid; gap:14px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:1fr 1fr; }
  h2.h{ font-family:var(--disp); font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-dim); margin:0 0 14px; display:flex; align-items:center; gap:8px; justify-content:space-between;}
  h2.h .h-left{ display:flex; align-items:center; gap:8px; }
  .section{ margin-bottom:28px; }
  .muted{ color:var(--text-dim); }
  .small{ font-size:12px; }
  .mono{ font-family:var(--mono); }

  .sig{ width:11px; height:11px; border-radius:50%; display:inline-block; flex:none; }
  .sig-green{ background:var(--green); box-shadow:0 0 6px var(--green); }
  .sig-amber{ background:var(--amber); box-shadow:0 0 6px var(--amber); }
  .sig-red{ background:var(--red); box-shadow:0 0 6px var(--red); }

  .kpi{ position:relative; overflow:hidden; }
  .kpi .label{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); }
  .kpi .val{ font-family:var(--disp); font-size:30px; font-weight:700; margin-top:6px; }
  .kpi .sub{ font-size:11px; color:var(--text-dim); margin-top:4px; }
  .kpi .accent{ position:absolute; top:0; left:0; right:0; height:3px; }

  .btn{ text-transform:uppercase; letter-spacing:.06em; padding:8px 14px; border-radius:7px; border:1px solid var(--border); background:var(--panel-alt); color:var(--text); cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn:hover{ border-color:var(--teal); color:var(--teal); }
  .btn-primary{ background:var(--teal); border-color:var(--teal); color:#04211D; font-weight:700; }
  .btn-primary:hover{ opacity:.9; color:#04211D; }
  .btn-ai{ background:var(--purple); border-color:var(--purple); color:#1A1330; font-weight:700; }
  .btn-ai:hover{ opacity:.9; color:#1A1330; }
  .btn-danger:hover{ border-color:var(--red); color:var(--red); }
  .btn-sm{ padding:5px 9px; font-size:10px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  input[type=number], input[type=text], textarea{ background:var(--panel-alt); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 8px; font-family:var(--mono); font-size:12px; }
  input[type=range]{ width:100%; accent-color:var(--teal); }
  textarea{ width:100%; font-family:var(--sans); resize:vertical; }
  label.field{ display:block; margin-bottom:10px; }
  label.field .fl{ display:block; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-bottom:4px; }
  label.field input, label.field select, label.field textarea{ width:100%; }

  .gantt-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); }
  .g-row{ display:flex; border-bottom:1px solid var(--border-soft); align-items:stretch; }
  .g-label{ position:sticky; left:0; z-index:2; width:290px; min-width:290px; background:var(--panel); border-right:1px solid var(--border); padding:8px 12px; display:flex; flex-direction:column; justify-content:center; gap:3px;}
  .g-label .tname{ font-size:12px; font-weight:600; line-height:1.3; display:flex; justify-content:space-between; gap:6px;}
  .g-label .tmeta{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; color:var(--text-dim); flex-wrap:wrap;}
  .g-label .tmeta input, .g-label .tmeta select{ padding:2px 4px; font-size:10px; }
  .g-label .tmeta input[type=number]{ width:38px; }
  .g-phase-row .g-label{ background:var(--panel-hi); font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--text-dim); }
  .g-phase-row{ border-bottom:1px solid var(--border); }
  .g-track{ position:relative; height:40px; flex:none; }
  .g-bar{ position:absolute; top:9px; height:20px; border-radius:4px; display:flex; align-items:center; padding:0 6px; font-family:var(--mono); font-size:9.5px; font-weight:700; color:#04141A; white-space:nowrap; overflow:hidden; }
  .g-bar .ring{ position:absolute; inset:-3px; border-radius:6px; border:2px solid var(--red); }
  .week-col{ width:22px; flex:none; border-right:1px solid var(--border-soft); }
  .g-header{ display:flex; position:sticky; top:0; z-index:3; background:var(--panel-hi); border-bottom:1px solid var(--border); }
  .g-header .g-label{ background:var(--panel-hi); }
  .wk-tick{ width:22px; flex:none; text-align:center; font-family:var(--mono); font-size:9px; color:var(--text-dim); padding-top:8px; border-right:1px solid var(--border-soft); }
  .x-del{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:12px; padding:0 2px;}
  .x-del:hover{ color:var(--red); }

  .res-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-soft); }
  .res-name{ width:230px; min-width:230px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .res-cap{ font-family:var(--mono); font-size:10px; color:var(--text-dim); }
  .res-cells{ display:flex; gap:2px; overflow-x:auto; }
  .res-cell{ width:16px; height:22px; border-radius:2px; flex:none; }

  .chip{ display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:20px; border:1px solid var(--border); }

  .risk-card{ border-left:3px solid var(--amber); position:relative; }
  .risk-card h3{ font-size:13px; margin:0 0 8px; padding-right:20px;}
  .risk-card .lbl{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); margin-top:10px; }
  .risk-card ul{ margin:6px 0 0; padding-left:18px; font-size:12.5px; line-height:1.6; }
  .risk-card .x-del{ position:absolute; top:12px; right:12px; }

  .eva-table{ width:100%; border-collapse:collapse; }
  .eva-table td{ padding:9px 6px; border-bottom:1px solid var(--border-soft); font-size:13px; }
  .eva-table td.k{ color:var(--text-dim); }
  .eva-table td.v{ font-family:var(--mono); text-align:right; font-weight:700; }

  .ai-diff{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px; }
  .ai-diff .arrow{ color:var(--purple); font-family:var(--mono); }

  .chat-fab{ position:fixed; bottom:22px; right:22px; z-index:50; background:var(--purple); color:#1A1330; border:none; border-radius:30px; padding:12px 18px; font-family:var(--mono); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; cursor:pointer; box-shadow:0 6px 20px rgba(155,135,245,.4); display:flex; align-items:center; gap:8px;}
  .chat-panel{ position:fixed; bottom:80px; right:22px; width:360px; max-height:70vh; background:var(--panel); border:1px solid var(--border); border-radius:12px; z-index:50; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.5); overflow:hidden;}
  .chat-head{ padding:12px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--panel-hi);}
  .chat-head .t{ font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--purple); }
  .chat-body{ flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; min-height:120px; }
  .msg{ font-size:12.5px; line-height:1.5; padding:8px 10px; border-radius:8px; max-width:88%; }
  .msg.user{ align-self:flex-end; background:var(--teal-dim); border:1px solid var(--teal); }
  .msg.ai{ align-self:flex-start; background:var(--purple-dim); border:1px solid var(--purple); white-space:pre-wrap; }
  .msg.hint{ align-self:center; color:var(--text-faint); font-family:var(--mono); font-size:10.5px; }
  .chat-input{ display:flex; gap:6px; padding:10px; border-top:1px solid var(--border); }
  .chat-input input{ flex:1; }
  .close-x{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--panel-hi); border:1px solid var(--teal); color:var(--teal); font-family:var(--mono); font-size:11px; padding:8px 16px; border-radius:20px; z-index:60; }

  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:70; display:flex; align-items:center; justify-content:center; }
  .modal{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; width:420px; max-height:80vh; overflow-y:auto; }

  .addbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; padding:14px; background:var(--panel-alt); border-radius:8px; margin-bottom:14px; }
  .addbar label.field{ margin-bottom:0; min-width:120px; flex:1;}

  @media (max-width:900px){
    .grid-4{ grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;}
    .nav{ display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>
      <input class="proj-name-input" id="projNameInput" onchange="renameProject(this.value)"/>
      <div class="tag">AI RESOURCE &amp; SCHEDULE OPTIMIZER · WORKS WITH ANY PROJECT</div>
    </div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="topbar-right">
    <span id="bridgeBadge"></span>
    <select id="projSwitcher" onchange="onSwitcherChange(this.value)"></select>
    <button class="btn btn-sm" onclick="saveProject()">💾 Save</button>
    <button class="btn btn-sm" onclick="exportProject()">⇩ Export</button>
    <label class="btn btn-sm" style="cursor:pointer;">⇧ Import<input type="file" accept="application/json" style="display:none;" onchange="importProject(event)"/></label>
  </div>
</div>

<div class="wrap" id="content"></div>
<div id="toastHost"></div>

<button class="chat-fab" id="chatFab" onclick="toggleChat()">✦ AI Assistant</button>
<div class="chat-panel" id="chatPanel" style="display:none;"></div>

<script>
/* ============ AI BRIDGE ============ */
// This app talks to Claude through the same server that's hosting this page (app.py),
// which holds the Anthropic API key server-side. A relative path means this works
// identically whether run locally or deployed to a public URL.
const AI_ENDPOINT = "/v1/messages";
let bridgeStatus = 'unknown'; // 'connected' | 'offline' | 'unknown'

async function checkBridge(){
  try{
    const r = await fetch(AI_ENDPOINT.replace('/v1/messages','/health'), { method:'GET' });
    bridgeStatus = r.ok ? 'connected' : 'offline';
  }catch(e){ bridgeStatus = 'offline'; }
  renderBridgeBadge();
}
function renderBridgeBadge(){
  const el = document.getElementById('bridgeBadge');
  if(!el) return;
  if(bridgeStatus==='connected') el.innerHTML = `<span class="badge-live" style="color:var(--green); border-color:var(--green);"><span class="dot2" style="background:var(--green);"></span>AI BRIDGE CONNECTED</span>`;
  else if(bridgeStatus==='offline') el.innerHTML = `<span class="badge-live" style="color:var(--amber); border-color:var(--amber); cursor:pointer;" onclick="checkBridge()" title="Click to retry"><span class="dot2" style="background:var(--amber);"></span>AI OFFLINE — using built-in engine</span>`;
  else el.innerHTML = `<span class="badge-live"><span class="dot2"></span>CHECKING AI BRIDGE…</span>`;
}

/* ============ BUILT-IN LOCAL ENGINE (no server, no API key — always works) ============ */
// This is a self-contained rule-based generator and scheduler. It runs entirely in the
// browser. The app prefers the Claude AI bridge when connected (smarter output), but
// Generate Project and AI Optimizer both fall back to this automatically, so the MVP
// never depends on an external call to function.

    label: 'Construction / Renovation', defaultWeeks: 20,
    keywords: ['renovat','construct','build','house','kitchen','bathroom','flooring','contractor','site','facility','centre','center','building','apartment','flat','tunnel','infrastructure'],
    resources: [
      {key:'pmo', name:'Project Management Team', capacity:2},
      {key:'design', name:'Design / Architect Team', capacity:2},
      {key:'permits', name:'Permitting & Compliance', capacity:1},
      {key:'crew', name:'Construction / Contractor Crew', capacity:1},
      {key:'me', name:'M&E Team (Electrical / Plumbing)', capacity:1},
      {key:'finish', name:'Finishing & Fit-Out Team', capacity:2},
    ],
    tasks: [
      {name:'Feasibility & Site Assessment', phase:'1 · Initiation', resource:'pmo', sf:0.00, df:0.08},
      {name:'Budget & Funding Plan', phase:'1 · Initiation', resource:'pmo', sf:0.03, df:0.08},
      {name:'Concept & Schematic Design', phase:'2 · Design', resource:'design', sf:0.10, df:0.15},
      {name:'Detailed Design & Engineering', phase:'2 · Design', resource:'design', sf:0.20, df:0.12},
      {name:'Permit Application & Approval', phase:'2 · Design', resource:'permits', sf:0.25, df:0.15},
      {name:'Contractor Tender & Award', phase:'3 · Procurement', resource:'pmo', sf:0.30, df:0.10},
      {name:'Materials Procurement', phase:'3 · Procurement', resource:'pmo', sf:0.35, df:0.12},
      {name:'Site Preparation', phase:'4 · Construction', resource:'crew', sf:0.42, df:0.08},
      {name:'Structural Works', phase:'4 · Construction', resource:'crew', sf:0.48, df:0.20},
      {name:'Electrical & Plumbing Rough-In', phase:'4 · Construction', resource:'me', sf:0.58, df:0.15},
      {name:'Interior Finishes', phase:'5 · Fit-Out', resource:'finish', sf:0.75, df:0.15},
      {name:'Furniture & Fixtures', phase:'5 · Fit-Out', resource:'finish', sf:0.85, df:0.08},
      {name:'Inspection & Handover', phase:'6 · Closeout', resource:'pmo', sf:0.92, df:0.08},
    ],
    risks: [
      {title:'Permit & Regulatory Delay', risk:'Approval timelines are often the biggest schedule unknown.', strategy:['Engage authorities early','Submit complete documentation','Build schedule buffer around approvals']},
      {title:'Contractor / Crew Availability', risk:'Construction crews are often a single-threaded, scarce resource.', strategy:['Book crews well in advance','Maintain a backup contractor list','Track progress weekly']},
      {title:'Budget Overrun', risk:'Ground conditions, material prices, or scope changes can inflate cost.', strategy:['Maintain a contingency reserve','Review costs regularly','Use value engineering where needed']},
    ],
  },
  software: {

    keywords: ['app','software','website','platform','code','dev','mvp','api','mobile','saas','application','system','feature','product'],
    resources: [
      {key:'pm', name:'Product / Project Owner', capacity:1},
      {key:'design', name:'Design Team', capacity:1},
      {key:'backend', name:'Backend Team', capacity:2},
      {key:'frontend', name:'Frontend / Mobile Team', capacity:2},
      {key:'qa', name:'QA Team', capacity:1},
    ],
    tasks: [
      {name:'Requirements & Scoping', phase:'1 · Discovery', resource:'pm', sf:0.00, df:0.08},
      {name:'UX Research & Wireframes', phase:'1 · Discovery', resource:'design', sf:0.05, df:0.12},
      {name:'UI Design', phase:'2 · Design', resource:'design', sf:0.15, df:0.15},
      {name:'Backend Architecture & Setup', phase:'3 · Build', resource:'backend', sf:0.25, df:0.15},
      {name:'Core Feature Development', phase:'3 · Build', resource:'backend', sf:0.35, df:0.30},
      {name:'Frontend / Mobile Development', phase:'3 · Build', resource:'frontend', sf:0.35, df:0.30},
      {name:'Integration', phase:'3 · Build', resource:'backend', sf:0.60, df:0.12},
      {name:'QA & Bug Fixing', phase:'4 · Testing', resource:'qa', sf:0.70, df:0.18},
      {name:'User Acceptance Testing', phase:'4 · Testing', resource:'qa', sf:0.85, df:0.08},
      {name:'Launch Prep & Deployment', phase:'5 · Launch', resource:'pm', sf:0.92, df:0.08},
    ],
    risks: [
      {title:'Scope Creep', risk:'Requirements can expand mid-sprint without a clear backlog owner.', strategy:['Assign a single product owner','Time-box scope reviews each sprint']},
      {title:'Integration Risk', risk:'Frontend and backend work streams may drift out of sync.', strategy:['Define API contracts early','Integrate continuously, not at the end']},
      {title:'QA Bottleneck', risk:'Testing capacity is often the smallest team relative to build output.', strategy:['Automate regression tests','Start QA involvement during build, not after']},
    ],
  },
  event: {
    label: 'Event Planning', defaultWeeks: 10,
    keywords: ['event','launch event','festival','conference','wedding','concert','ceremony','summit','exhibition','gala'],
    resources: [
      {key:'pm', name:'Event Coordination Team', capacity:2},
      {key:'vendor', name:'Vendor & Logistics Team', capacity:1},
      {key:'marketing', name:'Marketing & Promotion Team', capacity:1},
      {key:'ops', name:'On-Site Operations Team', capacity:2},
    ],
    tasks: [
      {name:'Concept & Budget Approval', phase:'1 · Planning', resource:'pm', sf:0.00, df:0.10},
      {name:'Venue Selection & Booking', phase:'1 · Planning', resource:'vendor', sf:0.08, df:0.12},
      {name:'Vendor & Supplier Contracts', phase:'2 · Logistics', resource:'vendor', sf:0.20, df:0.20},
      {name:'Program & Talent Confirmation', phase:'2 · Logistics', resource:'pm', sf:0.35, df:0.20},
      {name:'Marketing & Promotion Campaign', phase:'3 · Promotion', resource:'marketing', sf:0.30, df:0.35},
      {name:'On-Site Logistics Planning', phase:'4 · Preparation', resource:'ops', sf:0.65, df:0.15},
      {name:'Rehearsal & Final Checks', phase:'4 · Preparation', resource:'ops', sf:0.85, df:0.08},
      {name:'Event Day Execution', phase:'5 · Event', resource:'ops', sf:0.94, df:0.06},

    risks: [

    ],
  },
  marketing: {
    label: 'Marketing Campaign', defaultWeeks: 8,
    keywords: ['campaign','marketing','brand','advertising','social media','promotion','rebrand','launch campaign'],
    resources: [
      {key:'strategy', name:'Strategy & Planning Team', capacity:1},
      {key:'creative', name:'Creative / Content Team', capacity:2},
      {key:'media', name:'Media Buying Team', capacity:1},
      {key:'analytics', name:'Analytics Team', capacity:1},
    ],
    tasks: [
      {name:'Campaign Strategy & Goals', phase:'1 · Strategy', resource:'strategy', sf:0.00, df:0.12},
      {name:'Audience & Market Research', phase:'1 · Strategy', resource:'analytics', sf:0.08, df:0.12},
      {name:'Creative Concept Development', phase:'2 · Creative', resource:'creative', sf:0.20, df:0.20},
      {name:'Content Production', phase:'2 · Creative', resource:'creative', sf:0.35, df:0.25},
      {name:'Media Planning & Buying', phase:'3 · Media', resource:'media', sf:0.45, df:0.20},
      {name:'Campaign Launch', phase:'4 · Launch', resource:'media', sf:0.70, df:0.10},
      {name:'Performance Monitoring & Optimization', phase:'5 · Optimization', resource:'analytics', sf:0.78, df:0.15},

function detectArchetype(lowerDesc){
  let best = 'generic', bestScore = 0;
  for(const [key, arch] of Object.entries(ARCHETYPES)){
    const score = arch.keywords.filter(k=>lowerDesc.includes(k)).length;
    if(score > bestScore){ bestScore = score; best = key; }
  }
  return best;
}
function parseWeeks(desc, explicit){
  if(explicit) return Math.max(1, parseInt(explicit));
  const lower = desc.toLowerCase();
  let m = lower.match(/(\d+)\s*-?\s*(week|wk)/);
  if(m) return Math.max(1, parseInt(m[1]));
  m = lower.match(/(\d+)\s*-?\s*(month|mo)\b/);
  if(m) return Math.max(1, Math.round(parseInt(m[1]) * 4.33));
  return null;
}
function parseComponents(desc){
  const m = desc.match(/(?:covering|including|involving)\s+([^.]+)/i);
  if(!m) return [];
  return m[1].split(/,|\band\b/i).map(s=>s.trim()).filter(s=>s.length>1 && s.length<40).slice(0,8);
}
function titleCase(s){ return s.replace(/\b\w/g, c=>c.toUpperCase()); }

function localGenerateProject(desc, explicitWeeks, includeRisks){
  const lower = desc.toLowerCase();
  const archKey = detectArchetype(lower);
  const arch = ARCHETYPES[archKey];
  const totalWeeks = parseWeeks(desc, explicitWeeks) || arch.defaultWeeks;
  const components = parseComponents(desc);

  const resources = arch.resources.map(r=>({ id: r.key, name: r.name, capacity: r.capacity }));
  let templateTasks = arch.tasks.map(x=>({...x}));

  if(components.length){
    const phaseTotals = {};
    templateTasks.forEach(x=> phaseTotals[x.phase] = (phaseTotals[x.phase]||0) + x.df);
    const corePhase = Object.entries(phaseTotals).sort((a,b)=>b[1]-a[1])[0][0];
    const coreRange = templateTasks.filter(x=>x.phase===corePhase);
    const coreResources = [...new Set(coreRange.map(x=>x.resource))];
    const startF = Math.min(...coreRange.map(x=>x.sf));
    const endF = Math.max(...coreRange.map(x=>x.sf+x.df));
    const span = endF - startF;
    const per = span / components.length;
    const newCoreTasks = components.map((c,i)=>({
      name: titleCase(c), phase: corePhase,
      resource: coreResources[i % coreResources.length],
      sf: startF + i*per, df: per*0.9,
    }));
    templateTasks = templateTasks.filter(x=>x.phase!==corePhase).concat(newCoreTasks);
  }

  let counter = 0;
  const tasks = templateTasks.map(x=>{
    counter++;
    let start = Math.max(1, Math.round(x.sf*totalWeeks)+1);
    let dur = Math.max(1, Math.round(x.df*totalWeeks));
    if(start > totalWeeks) start = totalWeeks;
    if(start + dur - 1 > totalWeeks) dur = Math.max(1, totalWeeks - start + 1);
    return { id:'T'+counter, name:x.name, phase:x.phase, resource:x.resource, start, dur };
  }).sort((a,b)=> a.start - b.start);

  return {
    name: titleCase(desc.split(/[.,]/)[0].slice(0,60)) || arch.label + ' Project',
    totalWeeks, resources, tasks,
    risks: includeRisks ? arch.risks.map(r=>({title:r.title, risk:r.risk, strategy:r.strategy})) : [],
    eva: { week: 1, actualPct: 0, bac: 100, ac: null },
  };
}

// Greedy resource-leveling: for each resource, walk its tasks in start-week order and
// push any task forward to the earliest week that doesn't exceed weekly capacity.
function localOptimize(project){
  const tasks = JSON.parse(JSON.stringify(project.tasks));
  const adjustments = [];
  project.resources.forEach(r=>{
    const occ = {};
    tasks.filter(t=>t.resource===r.id).sort((a,b)=> a.start-b.start || a.dur-b.dur).forEach(t=>{
      let start = t.start;
      const fits = s => { for(let w=s; w<s+t.dur; w++){ if((occ[w]||0) >= r.capacity) return false; } return true; };
      let guard = 0;
      while(!fits(start) && guard < project.totalWeeks*3){ start++; guard++; }
      if(start + t.dur - 1 > project.totalWeeks){ start = Math.max(1, project.totalWeeks - t.dur + 1); }
      for(let w=start; w<start+t.dur; w++){ occ[w] = (occ[w]||0)+1; }
      if(start !== t.start) adjustments.push({ id:t.id, taskName:t.name, from:t.start, newStart:start });
      t.start = start;
    });
  });
  return { tasks, adjustments };
}

/* ============ CORE METRICS ============ */
function computeMetrics(project){
  const {tasks, resources, totalWeeks} = project;
  const byResourceWeek = {};
  resources.forEach(r=> byResourceWeek[r.id] = {});
  tasks.forEach(t=>{
    if(!byResourceWeek[t.resource]) return;
    for(let w=t.start; w<t.start+t.dur; w++){
      if(w<1||w>totalWeeks) continue;
      (byResourceWeek[t.resource][w] = byResourceWeek[t.resource][w]||[]).push(t.id);
    }
  });
  const conflicts = [];
  resources.forEach(r=>{
    for(let w=1; w<=totalWeeks; w++){
      const ids = byResourceWeek[r.id][w]||[];
      if(ids.length > r.capacity) conflicts.push({resource:r.id, week:w, taskIds:ids, over:ids.length-r.capacity});
    }
  });
  let idleResourceWeeks=0, totalCapacityWeeks=0;
  resources.forEach(r=>{
    for(let w=1; w<=totalWeeks; w++){
      totalCapacityWeeks += r.capacity;
      const used = Math.min((byResourceWeek[r.id][w]||[]).length, r.capacity);
      idleResourceWeeks += (r.capacity - used);
    }
  });
  const conflictedTaskIds = new Set();
  conflicts.forEach(c=> c.taskIds.forEach(id=>conflictedTaskIds.add(id)));
  return { byResourceWeek, conflicts, conflictedTaskIds, idleResourceWeeks, totalCapacityWeeks,
    idlePct: totalCapacityWeeks ? (idleResourceWeeks/totalCapacityWeeks*100) : 0 };
}

async function runOptimize(){
  const p = state.project;
  state.optimizing = true; state.optimizeError = null; render();
  const baselineMetrics = computeMetrics(p);

  await checkBridge();
  if(bridgeStatus === 'connected'){
    try{
      const payload = {
        resources: p.resources.map(r=>({id:r.id, capacity:r.capacity})),
        tasks: p.tasks.map(t=>({id:t.id, name:t.name, phase:t.phase, resource:t.resource, start:t.start, dur:t.dur})),
        totalWeeks: p.totalWeeks,
      };
      const prompt = `You are a scheduling optimization engine for a project management tool. The current project is: "${p.name}".
Given the tasks and resource weekly capacities below, identify tasks causing resource conflicts (a resource used by more concurrent tasks than its capacity in a given week) and long idle gaps for a resource, then propose NEW start weeks (integer >=1) for the smallest possible number of tasks to reduce conflicts and idle time. Respect the approximate order of phases (don't move a task drastically earlier than its phase's other tasks). Total project should not extend meaningfully past week ${p.totalWeeks}.

DATA:
${JSON.stringify(payload)}

Respond with ONLY valid JSON (no markdown fences, no commentary) in exactly this shape:
{"rationale":"<1-2 sentence explanation of the main changes>","adjustments":[{"id":"T18","newStart":12}]}
Only include tasks whose start week you are actually changing.`;

      const response = await fetch(AI_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      const data = await response.json();
      let text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
      text = text.replace(/^```json\s*/i,'').replace(/```$/,'').trim();
      const parsed = JSON.parse(text);
      const adjustments = (parsed.adjustments||[]).map(a=>{
        const t = p.tasks.find(x=>x.id===a.id);
        if(!t) return null;
        const from = t.start;
        t.start = Math.max(1, parseInt(a.newStart)||t.start);
        return {id:a.id, taskName:t.name, from, newStart:t.start};
      }).filter(Boolean);
      state.lastOptimize = { rationale: '✦ Claude: ' + (parsed.rationale || 'Schedule adjusted to reduce conflicts.'), adjustments, baselineMetrics };
      state.optimizing = false; render(); return;
    }catch(err){ /* fall through to local engine below */ }
  }

  // Local fallback — deterministic resource-leveling, always available
  const { tasks: newTasks, adjustments } = localOptimize(p);
  p.tasks = newTasks;
  state.lastOptimize = {
    rationale: '⚙ Built-in resource-leveling engine (AI bridge offline): shifted conflicting tasks to the earliest week each resource had free capacity, respecting the project end date.',
    adjustments, baselineMetrics,
  };
  state.optimizing = false;
  render();
}
function resetToBaseline(){
  if(!state.lastOptimize){ showToast('No changes to revert'); return; }
  state.lastOptimize.adjustments.forEach(a=>{
    const t = state.project.tasks.find(x=>x.id===a.id);
    if(t) t.start = a.from;
  });
  state.lastOptimize = null; state.optimizeError = null;
  render();
}

/* ============ EVA ============ */
function renderEVA(){
  const p = state.project, e = p.eva;
  const plannedPct = Math.min(100, (e.week/p.totalWeeks*100));
  const PV = e.bac * (plannedPct/100);
  const EV = e.bac * (e.actualPct/100);
  const AC = e.ac !== null && e.ac !== undefined ? e.ac : EV * 1.08;
  const CV = EV - AC, SV = EV - PV;
  const CPI = AC ? EV/AC : 0, SPI = PV ? EV/PV : 0;
  const EAC = CPI ? e.bac/CPI : e.bac;
  const ETC = EAC - AC;
  const VAC = e.bac - EAC;

  const costMsg = CV >= 0 ? `<span style="color:var(--green)">under budget</span>` : `<span style="color:var(--red)">over budget</span>`;
  const schedMsg = SV >= 0 ? `<span style="color:var(--green)">ahead of schedule</span>` : `<span style="color:var(--red)">behind schedule</span>`;

  return `
  <div class="section grid grid-2">
    <div class="card">
      <h2 class="h">✦ Inputs</h2>
      <div class="small muted" style="margin-bottom:6px;">Current Week: <b class="mono">${e.week}</b> / ${p.totalWeeks}</div>
      <input type="range" min="1" max="${p.totalWeeks}" value="${e.week}" oninput="updateEva('week', this.value)"/>
      <div class="small muted" style="margin:14px 0 6px;">Actual % Complete: <b class="mono">${e.actualPct}%</b></div>
      <input type="range" min="0" max="100" value="${e.actualPct}" oninput="updateEva('actualPct', this.value)"/>
      <div style="display:flex; gap:14px; margin-top:16px;">
        <div style="flex:1;"><div class="small muted">Budget at Completion</div><input type="number" style="width:100%; margin-top:4px;" value="${e.bac}" onchange="updateEva('bac', this.value)"/></div>
        <div style="flex:1;"><div class="small muted">Actual Cost to Date</div><input type="number" style="width:100%; margin-top:4px;" value="${AC.toFixed(1)}" onchange="updateEva('ac', this.value)"/></div>
      </div>
      <div class="small muted" style="margin-top:10px;">Units are whatever currency/scale your project uses — edit BAC to match.</div>
    </div>
    <div class="card">
      <h2 class="h">✦ Earned Value Metrics</h2>
      <table class="eva-table">
        <tr><td class="k">Planned Value (PV)</td><td class="v">${PV.toFixed(1)}</td></tr>
        <tr><td class="k">Earned Value (EV)</td><td class="v">${EV.toFixed(1)}</td></tr>
        <tr><td class="k">Actual Cost (AC)</td><td class="v">${AC.toFixed(1)}</td></tr>
        <tr><td class="k">Cost Variance (CV)</td><td class="v" style="color:${CV>=0?'var(--green)':'var(--red)'}">${CV>=0?'+':''}${CV.toFixed(1)}</td></tr>
        <tr><td class="k">Schedule Variance (SV)</td><td class="v" style="color:${SV>=0?'var(--green)':'var(--red)'}">${SV>=0?'+':''}${SV.toFixed(1)}</td></tr>
        <tr><td class="k">Cost Performance Index (CPI)</td><td class="v">${CPI.toFixed(2)}</td></tr>
        <tr><td class="k">Schedule Performance Index (SPI)</td><td class="v">${SPI.toFixed(2)}</td></tr>
        <tr><td class="k">Estimate at Completion (EAC)</td><td class="v">${EAC.toFixed(1)}</td></tr>
        <tr><td class="k">Estimate to Complete (ETC)</td><td class="v">${ETC.toFixed(1)}</td></tr>
        <tr><td class="k">Variance at Completion (VAC)</td><td class="v" style="color:${VAC>=0?'var(--green)':'var(--red)'}">${VAC>=0?'+':''}${VAC.toFixed(1)}</td></tr>
      </table>
    </div>
  </div>
  <div class="section card">
    <h2 class="h">✦ Interpretation</h2>
    <p class="small" style="line-height:1.7;">At week <b>${e.week}</b>, the project is <b>${Math.abs(CV).toFixed(1)} ${costMsg}</b> and <b>${Math.abs(SV).toFixed(1)} ${schedMsg}</b>. A CPI of <b class="mono">${CPI.toFixed(2)}</b> means every 1 unit spent has returned ${CPI.toFixed(2)} units of planned work; an SPI of <b class="mono">${SPI.toFixed(2)}</b> means the project is progressing at ${(SPI*100).toFixed(0)}% of the planned rate. At the current performance trend, total cost is forecast at <b>${EAC.toFixed(1)}</b> against a budget of ${e.bac}.</p>
  </div>`;
}
function updateEva(field, value){
  state.project.eva[field] = field==='week' ? parseInt(value) : parseFloat(value);
  render();
}

  "totalWeeks": <integer>,
  "resources": [{"name": "<resource/team name>", "capacity": <integer>}],
  "tasks": [{"name": "<task name>", "phase": "<phase name>", "resourceName": "<must match a resources[].name>", "start": <integer>, "dur": <integer>}],
  "risks": [{"title": "<risk title>", "risk": "<one sentence>", "strategy": ["<step>", "<step>"]}]
}`;
      const response = await fetch(AI_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 4000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      const data = await response.json();
      let text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
      text = text.replace(/^```json\s*/i,'').replace(/```$/,'').trim();
      const parsed = JSON.parse(text);
      if(!parsed.resources || !parsed.tasks || !parsed.resources.length) throw new Error('AI response was missing resources or tasks');

      const resources = parsed.resources.map(r=>({ id: genId('res-'), name: r.name || 'Team', capacity: Math.max(1, parseInt(r.capacity)||1) }));
      const nameToId = {};
      resources.forEach(r=> nameToId[r.name.toLowerCase().trim()] = r.id);
      const totalWeeks = Math.max(1, parseInt(parsed.totalWeeks) || (targetWeeks?parseInt(targetWeeks):12));
      let counter = 0;
      const tasks = (parsed.tasks||[]).map(t=>{
        counter++;
        const rid = nameToId[(t.resourceName||'').toLowerCase().trim()] || resources[0].id;
        const start = Math.min(totalWeeks, Math.max(1, parseInt(t.start)||1));
        const dur = Math.max(1, parseInt(t.dur)||1);
        return { id:'T'+counter, name: t.name || ('Task '+counter), phase: t.phase || 'Unassigned Phase', resource: rid, start, dur };
      });
      const risks = includeRisks ? (parsed.risks||[]).map(r=>({
        title: r.title || 'Risk', risk: r.risk || '', strategy: Array.isArray(r.strategy) ? r.strategy : [],
      })) : [];

      state.project = { name: parsed.name || 'New Project', totalWeeks, resources, tasks, risks, eva: { week: 1, actualPct: 0, bac: 100, ac: null } };
      state.projectId = null; state.lastOptimize = null;
      state.generating = false; state.generateError = null;
      render();
      showToast('✦ Project generated by Claude — review and edit as needed');
      setTab('schedule');
      return;
    }catch(err){ /* fall through to local engine below */ }
  }

  // Local fallback — always works, no network required
  try{
    state.project = localGenerateProject(desc, targetWeeks, includeRisks);
    state.projectId = null; state.lastOptimize = null;
    state.generating = false; state.generateError = null;
    render();
    showToast(bridgeStatus==='connected' ? 'Generated locally (Claude response was unusable)' : '⚙ Generated locally — AI bridge offline, using built-in templates');
    setTab('schedule');
  }catch(err){
    state.generating = false;
    state.generateError = 'Could not generate a project from that description — try adding the project type, team size, or duration.';
    render();
  }
}

/* ============ EXPORT / IMPORT ============ */
function exportProject(){
  const blob = new Blob([JSON.stringify(state.project, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (state.project.name||'project').replace(/[^a-z0-9]+/gi,'_').toLowerCase() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importProject(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.tasks || !parsed.resources) throw new Error('missing tasks/resources');
      state.project = Object.assign(JSON.parse(JSON.stringify(BLANK_TEMPLATE)), parsed);
      state.projectId = null; state.lastOptimize = null; state.optimizeError = null;
      render();
      showToast('Project imported');
    }catch(e){ showToast('Import failed — not a valid project file'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* ============ PERSISTENCE (window.storage) ============ */
async function refreshIndex(){
  try{
    const r = await window.storage.get('project_index');
    state.savedIndex = r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ state.savedIndex = []; }
}
async function saveProject(){
  try{
    if(!state.projectId) state.projectId = genId('proj-');
    await window.storage.set('project:'+state.projectId, JSON.stringify(state.project));
    await refreshIndex();
    const existing = state.savedIndex.find(x=>x.id===state.projectId);
    if(existing) existing.name = state.project.name;
    else state.savedIndex.push({id: state.projectId, name: state.project.name});
    await window.storage.set('project_index', JSON.stringify(state.savedIndex));
    showToast('Saved to your browser');
  }catch(e){ showToast('Save failed: '+e.message); }
  render();
}
async function loadProjectById(id){
  try{
    const r = await window.storage.get('project:'+id);
    state.project = JSON.parse(r.value);
    state.projectId = id; state.lastOptimize = null; state.optimizeError = null;
    render();
    showToast('Project loaded');
  }catch(e){ showToast('Could not load that project'); }
}
function renderSwitcher(){
  const sel = document.getElementById('projSwitcher');
  const opts = [`<option value="">${state.projectId?'— switch project —':'— unsaved draft —'}</option>`]
    .concat(state.savedIndex.map(p=>`<option value="${p.id}" ${p.id===state.projectId?'selected':''}>${p.name}</option>`));
  sel.innerHTML = opts.join('');
}
function onSwitcherChange(id){ if(id) loadProjectById(id); }

/* ============ CHAT ============ */
function toggleChat(){ state.chatOpen = !state.chatOpen; render(); }
function renderChat(){
  const panel = document.getElementById('chatPanel');
  const fab = document.getElementById('chatFab');
  fab.style.display = state.chatOpen ? 'none' : 'flex';
  if(!state.chatOpen){ panel.style.display='none'; return; }
  panel.style.display = 'flex';
  panel.innerHTML = `
    <div class="chat-head"><span class="t">✦ AI Assistant</span><button class="close-x" onclick="toggleChat()">✕</button></div>
    <div class="chat-body" id="chatBody">
      ${state.chatMessages.length===0 ? `<div class="msg hint">Ask about this project's schedule, resource conflicts, EVA figures, or risks.</div>` : ''}
      ${state.chatMessages.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}">${escapeHtml(m.content)}</div>`).join('')}
      ${state.chatLoading ? `<div class="msg hint">thinking…</div>` : ''}
    </div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')sendChat()"/>
      <button class="btn btn-primary" onclick="sendChat()">Send</button>
    </div>`;
  const body = document.getElementById('chatBody');
  if(body) body.scrollTop = body.scrollHeight;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || state.chatLoading) return;
  state.chatMessages.push({role:'user', content:text});
  input.value='';
  state.chatLoading = true;
  render();

  const p = state.project, m = computeMetrics(p);
  const contextSummary = `Project: "${p.name}" — ${p.totalWeeks}-week planning horizon.
Tasks: ${p.tasks.length}, across phases: ${[...new Set(p.tasks.map(t=>t.phase))].join(', ') || 'none'}.
Resources: ${p.resources.map(r=>r.name+' (cap '+r.capacity+'/wk)').join(', ') || 'none'}.
Current conflicts: ${m.conflicts.length} (${m.conflicts.map(c=>{const r=p.resources.find(x=>x.id===c.resource); return (r?r.name:c.resource)+' wk'+c.week;}).join('; ') || 'none'}).
Idle resource time: ${m.idlePct.toFixed(1)}%.
Known risks: ${p.risks.map(r=>r.title).join(', ') || 'none logged'}.
Answer as a helpful project management assistant for this project. Be concise (under 120 words) unless asked for detail.`;

  try{
    const response = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: contextSummary,
        messages: state.chatMessages.map(mm=>({role:mm.role, content:mm.content}))
      })
    });
    const data = await response.json();
    const reply = (data.content||[]).map(b=>b.text||'').join('\n').trim() || 'No response.';
    state.chatMessages.push({role:'assistant', content:reply});
  }catch(err){
    state.chatMessages.push({role:'assistant', content:'Could not reach Claude right now (' + err.message + '). The rest of the app still works — try again in a moment.'});
  }
  state.chatLoading = false;
  render();
}

/* ============ INIT ============ */
(async function init(){
  render();
  renderBridgeBadge();
  checkBridge();
  await refreshIndex();
  renderSwitcher();
})();
</script>
